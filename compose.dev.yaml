# Casual-SST — local development stack
#
# Brings up:
#   * casual-sst (the API + WS server)  → http://localhost:8000
#   * demo       (nginx serving demo/)  → http://localhost:8080
#
# Hugging Face model cache is a named volume — persists across rebuilds
# so the first call downloads the Whisper model and subsequent runs reuse it.
#
# Usage:
#   docker compose -f compose.dev.yaml up --build
#   docker compose -f compose.dev.yaml down       # leaves the model cache
#   docker compose -f compose.dev.yaml down -v    # wipes everything
#
# Open http://localhost:8080 in Chrome to drive the demo.

services:
  casual-sst:
    build:
      context: .
      dockerfile: Dockerfile
    image: casual-sst:dev
    container_name: casual-sst
    # Local dev runs as root so the named hf-cache volume is writable
    # without a pre-chown ritual. Prod (compose-not-shipped) still uses
    # the Dockerfile's non-root `casual` user.
    user: "0:0"
    environment:
      CONFIG_PATH: /app/config/local.yaml
      PYTHONPATH: /app/src
    ports:
      - "8100:8000"
    volumes:
      # Live-mount config + src so config tweaks and dev edits don't need a rebuild.
      - ./config:/app/config:ro
      - ./src:/app/src:ro
      # Persistent HF model cache so we re-download the Whisper model once.
      - hf-cache:/cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost',8000))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  demo:
    image: nginx:1.27-alpine
    container_name: casual-sst-demo
    ports:
      - "8180:80"
    volumes:
      - ./demo:/usr/share/nginx/html:ro
    depends_on:
      casual-sst:
        condition: service_healthy

volumes:
  hf-cache:
    name: casual-sst-hf-cache
