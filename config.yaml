# Casual-SST runtime config.
# CONFIG_PATH env var points at this file.

server:
  host: 0.0.0.0
  port: 8000
  bypass_auth: true

# language → backend name. "*" is the fallback.
# `auto`, `hinglish`, `hi-en` are virtual langs that route to a multilingual backend.
routes:
  # native streaming, Apache 2.0 open weights, 13 langs
  en: voxtral
  hi: voxtral
  zh: voxtral
  ar: voxtral
  fr: voxtral
  de: voxtral
  es: voxtral
  it: voxtral
  ja: voxtral
  ko: voxtral
  nl: voxtral
  pt: voxtral
  ru: voxtral

  # Indic + Indic-English code-switching (AI4Bharat IndicConformer)
  ta: indic_conformer
  bn: indic_conformer
  mr: indic_conformer
  te: indic_conformer
  pa: indic_conformer
  gu: indic_conformer
  kn: indic_conformer
  ml: indic_conformer
  hinglish: indic_conformer
  hi-en: indic_conformer
  ta-en: indic_conformer
  bn-en: indic_conformer

  # multilingual / unknown → Voxtral with language=None
  auto: voxtral

  # everything else → faster-whisper-turbo with hallucination guards
  "*": whisper_turbo

vad:
  # silero VAD knobs
  threshold: 0.5
  min_speech_ms: 250        # require >= 250ms of actual speech to even emit a final
  long_silence_ms: 1000     # mark long_silence when last speech is >1s in the past
  short_flush_ms: 500       # finalize short utterance after 500ms of silence
  long_flush_ms: 2000       # idle-buffer flush

lid:
  enabled: true
  interval_speech_ms: 3000  # run LID every 3s of accumulated SPEECH (not wall-clock)
  window_ms: 5000           # over the last 5s of audio
  model: faster-whisper-tiny
  device: cpu
  switch_threshold: 0.85    # confidence required to push into history
  switch_consecutive: 2     # N consecutive disagreements with active lang → switch
  strong_lock_after_finals: 30   # participant profile locks lang after this many same-lang finals

profile:
  enabled: true
  recent_finals_window: 5   # last 5 finals fed as personalized initial_prompt
  use_profile_as_lid_tiebreaker: true

cut_mark:
  min_chars: 48
  min_probability: 0.7
  force_split_after_s: 10   # any audio longer than this gets force-split

initial_prompt:
  enabled: true
  max_finals: 2
  min_prob_for_seeding: 0.7  # only seed initial_prompt with high-confidence finals
  blacklist: ['. .', '...']

hallucination:
  denylist:
    en:
      - "thank you for watching"
      - "thanks for watching"
      - "subtitles by"
      - "amara.org"
      - "subscribe to"
      - "like and subscribe"
      - "(music)"
      - "[music]"
      - "♪"
      - ".com"
      - "you"
      - ". ."
      - "..."
    hi:
      - "हमारे चैनल को सब्सक्राइब करें"
    ta: []
    "*":
      - "♪"
      - "..."

backends:
  voxtral:
    kind: native_streaming
    module: casual_sst.backends.voxtral:VoxtralBackend
    model: mistralai/Voxtral-Mini-4B-Realtime-2602
    device: cuda:0
    delay_ms: 480           # 240..2400, lower = faster, higher = better accuracy
    max_model_len: 45000
    word_timestamps: true

  parakeet:
    kind: native_streaming
    module: casual_sst.backends.parakeet:ParakeetBackend
    model: nvidia/parakeet-tdt-0.6b-v3
    device: cuda:0
    compute_type: int8

  indic_conformer:
    kind: native_streaming
    module: casual_sst.backends.indic_conformer:IndicConformerBackend
    model: ai4bharat/indic-conformer-600m-multilingual
    device: cuda:0
    code_switch: true       # emit mixed-script output (Devanagari + Latin) for code-switching
    romanize_output: false  # set true if you want romanized Hinglish

  whisper_turbo:
    kind: chunked
    module: casual_sst.backends.whisper_turbo:WhisperTurboBackend
    model: large-v3-turbo
    device: auto            # auto | cuda | cpu
    compute_type: int8_float16
    beam_size: 1
    # Hardening — these are the knobs that prevent the Skynet hallucination hole
    no_speech_threshold: 0.85
    log_prob_threshold: -0.4
    compression_ratio_threshold: 2.0
    hallucination_silence_threshold: 2.0
    condition_on_previous_text: false  # NEVER true. Hard-coded in backend.
    min_phrase_prob: 0.6
    force_split_after_s: 8             # stricter than the global cut_mark setting
