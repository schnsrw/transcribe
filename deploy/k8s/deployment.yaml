apiVersion: apps/v1
kind: Deployment
metadata:
  name: casual-sst
  namespace: casual-sst
  labels:
    app: casual-sst
spec:
  # Casual-SST itself is stateless w.r.t. transcripts (nothing is
  # persisted) but each pod holds its own model in VRAM. Scaling up
  # is just running more pods — no need for stickiness across an
  # individual meeting's lifetime as long as your LB stickies by
  # meeting_id.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0       # zero-downtime updates
  selector:
    matchLabels:
      app: casual-sst
  template:
    metadata:
      labels:
        app: casual-sst
      annotations:
        # Hint to Prometheus scrapers. Adjust to your operator's labels.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: casual-sst
          # Override on each release. CI publishes both :latest and
          # :cuda-latest for the multi-arch CPU image and the CUDA image.
          image: schnsrw/casual-sst:cuda-latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: CONFIG_PATH
              value: /app/config/prod.yaml
          envFrom:
            - secretRef:
                name: casual-sst-env
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              nvidia.com/gpu: 1
            limits:
              cpu: "4"
              memory: 6Gi
              nvidia.com/gpu: 1
          # /health gates traffic; /healthz is the liveness probe.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 30      # ≤ 2.5 min for first model download
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: hf-cache
              mountPath: /cache/huggingface
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: casual-sst-hf-cache
      # Schedule on GPU nodes only. Adjust to your taint scheme.
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        # Replace with whatever labels your GPU nodes carry, or
        # remove for clusters where every node has a GPU.
        # node.kubernetes.io/instance-type: g5.xlarge
