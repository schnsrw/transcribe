# Casual-SST secrets — REPLACE the placeholders before applying.
# This template is committed to make the schema visible; the real
# secret should be either generated by your CD system or applied
# from a SealedSecret / SOPS-encrypted file.
apiVersion: v1
kind: Secret
metadata:
  name: casual-sst-env
  namespace: casual-sst
type: Opaque
stringData:
  # ── Required for the admin portal ───────────────────────────────────────
  ADMIN_TOKEN: "REPLACE_WITH_LONG_RANDOM_STRING"          # `openssl rand -hex 32`

  # ── Required when bypass_auth=false (the default in prod.yaml) ──────────
  # Option A: ASAP / Jitsi-style public keys.
  # Mount them via a separate ConfigMap or Secret at this path:
  ASAP_PUB_KEYS_FOLDER: "/keys"
  ASAP_PUB_KEYS_AUDS: "your-aud,another-aud"

  # Option B: shared HMAC secret (delete the ASAP_* lines above if using HMAC).
  # JWT_SECRET: "REPLACE_WITH_LONG_RANDOM_STRING"
  # JWT_ALGORITHM: "HS256"
  # JWT_AUDIENCE: "casual-sst"

  # ── Optional but recommended ────────────────────────────────────────────
  HF_TOKEN: ""                                            # raises HF download rate limits
  LOG_LEVEL: "INFO"

  # ── Optional LLM summarisation ──────────────────────────────────────────
  # LLM_BACKEND: "openai"
  # OPENAI_API_KEY: "sk-..."
  # OPENAI_MODEL: "gpt-4o-mini"

  # Rate-limit knobs (defaults 20/min, burst 5)
  # LLM_RATE_LIMIT_RPM: "60"
  # LLM_RATE_LIMIT_BURST: "10"
